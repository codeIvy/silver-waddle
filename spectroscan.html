<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SpectroScan</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12181d; --line:#1e2731;
    --ink:#e8f0f4; --dim:#6b7d88; --accent:#33e1a0; --warn:#ff5d5d;
    --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:var(--mono);-webkit-tap-highlight-color:transparent;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column}
  #view{position:relative;flex:1;overflow:hidden;background:#000}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transform:scaleX(1)}
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;
    display:flex;justify-content:space-between;align-items:flex-start;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  #hud .tag{color:var(--accent)}
  #status{position:absolute;left:16px;bottom:14px;font-size:12px;letter-spacing:.06em}
  #status.lock{color:var(--accent)} #status.seek{color:var(--warn)}
  /* control bar */
  #bar{background:var(--panel);border-top:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:center}
  button{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;color:var(--ink);border:1px solid var(--line);
    border-radius:2px;padding:12px 16px;flex:1}
  button.go{border-color:var(--accent);color:var(--accent)}
  button:active{background:var(--line)}
  button:disabled{opacity:.35}
  #gainWrap{display:flex;align-items:center;gap:8px;flex:1;color:var(--dim);font-size:10px;
    letter-spacing:.12em;text-transform:uppercase}
  input[type=range]{flex:1;accent-color:var(--accent)}
  #splash{position:absolute;inset:0;background:var(--bg);z-index:5;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;
    padding:32px;text-align:center}
  #splash h1{margin:0;font-size:26px;letter-spacing:.24em;font-weight:500}
  #splash h1 span{color:var(--accent)}
  #splash p{margin:0;max-width:34ch;font-size:12px;line-height:1.7;color:var(--dim);
    letter-spacing:.04em}
  #splash button{flex:none;padding:14px 28px}
</style>
</head>
<body>
<div id="stage">
  <div id="view">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="hud"><div><span class="tag">SPECTRO</span>SCAN</div><div id="fps">–</div></div>
    <div id="status" class="seek">seeking code…</div>
    <div id="splash">
      <h1>SPECTRO<span>SCAN</span></h1>
      <p>Point the rear camera at a marker-framed spectrogram. Keep both marker bars
         in view and sweep slowly left-to-right — the image plays as you move.</p>
      <button class="go" id="startBtn">Start camera</button>
      <div id="ctxNote" style="font-size:10px;letter-spacing:.1em;color:var(--dim)"></div>
    </div>
  </div>
  <div id="bar">
    <button id="freezeBtn" disabled>Freeze band</button>
    <div id="gainWrap">Vol<input type="range" id="gain" min="0" max="100" value="55"></div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------ *
 * SpectroScan — camera → sound decoder for marker-framed spectrograms
 * Format read (from the sample code):
 *   - dark = loud, on white
 *   - full-width dark MARKER bars top & bottom (pattern 1:1:4:1 thin/thick)
 *   - content (frequency) band = the large gap between marker groups
 * Detection: per-row dark-fraction across the code width; the biggest gap
 * between full-width dark rows is the content band.
 * ------------------------------------------------------------------ */

// ---- tunable constants -------------------------------------------------
const CFG = {
  PROC_W: 300,          // processing resolution width (px). lower = faster
  N_BINS: 128,          // frequency oscillators. lower this if audio stutters
  FREQ_MIN: 120,        // Hz at bottom of band
  FREQ_MAX: 3600,       // Hz at top of band
  SCALE: 'log',         // 'log' (musical) or 'lin'
  X_INSET: 0.10,        // ignore this fraction of width on each side (glare/edges)
  READ_COLS: 5,         // columns averaged around centre for the playhead
  MARKER_DARK: 0.55,    // a row is part of a rail if this fraction of width is dark
  MIN_BAND: 0.20,       // band must be at least this fraction of frame height
  DARK_FRAC: 0.45,      // adaptive: dark = below this fraction of frame's range
  GRACE: 8,             // frames to hold last band through a brief dropout
  GAMMA: 1.4,           // amplitude contrast (higher = more selective)
  NOISE_GATE: 0.05      // amplitudes below this are silenced
};

const video   = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx    = overlay.getContext('2d');
const statusEl= document.getElementById('status');
const fpsEl   = document.getElementById('fps');
const startBtn= document.getElementById('startBtn');
const splash  = document.getElementById('splash');
const freezeBtn=document.getElementById('freezeBtn');
const gainEl  = document.getElementById('gain');

// hidden processing canvas
const proc = document.createElement('canvas');
const pctx = proc.getContext('2d', { willReadFrequently:true });

let audioCtx, node, running=false, frozen=false, frozenBand=null;
let lastBand=null, graceFrames=0;
let prevProfile=null, dirSmooth=0;
let binFreqs = new Float32Array(CFG.N_BINS);
let amps = new Float32Array(CFG.N_BINS);

// ---- frequency table for the bins -------------------------------------
function buildFreqs(){
  for(let i=0;i<CFG.N_BINS;i++){
    const f = i/(CFG.N_BINS-1);
    binFreqs[i] = CFG.SCALE==='log'
      ? CFG.FREQ_MIN*Math.pow(CFG.FREQ_MAX/CFG.FREQ_MIN, f)
      : CFG.FREQ_MIN + (CFG.FREQ_MAX-CFG.FREQ_MIN)*f;
  }
}

// ---- AudioWorklet (additive synth) as an inline module ----------------
const workletCode = `
class Additive extends AudioWorkletProcessor {
  constructor(){
    super();
    this.N = 0; this.freqs=null; this.phase=null;
    this.target=null; this.cur=null;
    // sine lookup table for speed on mobile
    this.LUT_N = 2048;
    this.lut = new Float32Array(this.LUT_N+1);
    for(let i=0;i<=this.LUT_N;i++) this.lut[i]=Math.sin(2*Math.PI*i/this.LUT_N);
    this.gain = 0.5;
    this.port.onmessage = (e)=>{
      const d=e.data;
      if(d.type==='init'){
        this.N=d.freqs.length;
        this.freqs=d.freqs;
        this.phase=new Float32Array(this.N);
        this.target=new Float32Array(this.N);
        this.cur=new Float32Array(this.N);
      } else if(d.type==='amps'){
        this.target.set(d.amps);
      } else if(d.type==='gain'){
        this.gain=d.value;
      }
    };
  }
  sine(p){ // p in [0,1)
    const x=p*this.LUT_N; const i=x|0; const fr=x-i;
    return this.lut[i]+(this.lut[i+1]-this.lut[i])*fr;
  }
  process(inputs, outputs){
    const out=outputs[0][0];
    if(!this.N){ out.fill(0); return true; }
    const sr=sampleRate, n=out.length;
    const inc=new Float32Array(this.N);
    for(let k=0;k<this.N;k++) inc[k]=this.freqs[k]/sr;
    const smooth=0.15;                 // amplitude glide per block
    for(let k=0;k<this.N;k++) this.cur[k]+= (this.target[k]-this.cur[k])*smooth;
    let norm=0; for(let k=0;k<this.N;k++) norm+=this.cur[k];
    norm = norm>1 ? 1/Math.sqrt(norm) : 1;   // keep mix from clipping
    for(let s=0;s<n;s++){
      let acc=0;
      for(let k=0;k<this.N;k++){
        let ph=this.phase[k]+inc[k]; ph-=ph|0; this.phase[k]=ph;
        acc += this.cur[k]*this.sine(ph);
      }
      out[s]=Math.tanh(acc*norm*this.gain*2.2);  // soft-clip safety
    }
    return true;
  }
}
registerProcessor('additive', Additive);
`;

// ---- start ------------------------------------------------------------
function fail(msg){ statusEl.textContent=msg; statusEl.className='seek';
  startBtn.textContent='Retry'; startBtn.disabled=false; }

async function start(){
  buildFreqs();
  startBtn.disabled=true;

  // preflight: getUserMedia needs a secure context (https or localhost)
  if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
    fail('needs https or localhost — serve the file, don\u2019t open it directly');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ideal:'environment'},
              width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = stream;
    await video.play();
  }catch(err){
    const n=err&&err.name;
    if(n==='NotAllowedError')      fail('permission denied — allow camera and retry');
    else if(n==='NotFoundError')   fail('no camera found on this device');
    else if(n==='NotReadableError')fail('camera busy — close other apps using it');
    else                           fail('camera error: '+(n||err));
    return;
  }

  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const blob = new Blob([workletCode], {type:'application/javascript'});
  await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
  node = new AudioWorkletNode(audioCtx,'additive',{outputChannelCount:[1]});
  node.connect(audioCtx.destination);
  node.port.postMessage({type:'init', freqs:binFreqs});
  node.port.postMessage({type:'gain', value:gainEl.value/100});
  if(audioCtx.state!=='running') await audioCtx.resume();

  splash.style.display='none';
  freezeBtn.disabled=false;
  running=true;
  requestAnimationFrame(loop);
}

// ---- per-frame detect + sonify ---------------------------------------
let last=performance.now(), frames=0, fpsAcc=0;
function loop(now){
  if(!running) return;
  const vw=video.videoWidth, vh=video.videoHeight;
  if(vw){
    const pw=CFG.PROC_W, ph=Math.round(pw*vh/vw);
    if(proc.width!==pw){ proc.width=pw; proc.height=ph; }
    pctx.drawImage(video,0,0,pw,ph);
    const img=pctx.getImageData(0,0,pw,ph).data;

    // --- adaptive dark threshold from this frame's own range ---
    const x0=Math.floor(pw*CFG.X_INSET), x1=Math.ceil(pw*(1-CFG.X_INSET));
    const span=x1-x0;
    let lmin=255, lmax=0;
    for(let y=0;y<ph;y+=2){                     // sample every 2nd row for speed
      let base=y*pw*4;
      for(let x=x0;x<x1;x+=2){
        const i=base+x*4;
        const lum=(img[i]*0.299+img[i+1]*0.587+img[i+2]*0.114);
        if(lum<lmin)lmin=lum; if(lum>lmax)lmax=lum;
      }
    }
    // cutoff sits a fraction of the way up from darkest toward brightest
    const darkCut = lmin + (lmax-lmin)*CFG.DARK_FRAC;

    // --- per-row dark fraction across code width ---
    const darkFrac=new Float32Array(ph);
    for(let y=0;y<ph;y++){
      let d=0, base=y*pw*4;
      for(let x=x0;x<x1;x++){
        const i=base+x*4;
        const lum=(img[i]*0.299+img[i+1]*0.587+img[i+2]*0.114);
        if(lum<darkCut) d++;
      }
      darkFrac[y]=d/span;
    }
    // marker rows = full-width dark (a rail crosses the whole slice)
    const isRail=new Float32Array(ph);
    for(let y=0;y<ph;y++) isRail[y]= darkFrac[y]>=CFG.MARKER_DARK ? 1 : 0;

    // RAILS MODEL: user glides along two solid rails; every frame shows both.
    // Top rail = first dark-row group from the top; bottom rail = first from
    // the bottom; the frequency band is the clear span between them.
    let topRail=-1, botRail=-1;
    for(let y=0;y<ph;y++)          if(isRail[y]){ topRail=y; break; }
    for(let y=ph-1;y>=0;y--)       if(isRail[y]){ botRail=y; break; }
    // walk inward past the thickness of each rail to the band edge
    let bandTop=topRail, bandBot=botRail;
    while(bandTop<ph && isRail[bandTop]) bandTop++;   // skip below top rail
    while(bandBot>=0  && isRail[bandBot]) bandBot--;   // skip above bottom rail

    let band=null;
    if(topRail>=0 && botRail>=0 && (bandBot-bandTop) > ph*CFG.MIN_BAND){
      band={top:bandTop, bot:bandBot};
    }
    if(frozen && frozenBand) band=frozenBand;

    // --- sticky lock: hold last good band for a short grace period ---
    if(band){ lastBand=band; graceFrames=CFG.GRACE; }
    else if(graceFrames>0 && lastBand){ band=lastBand; graceFrames--; }

    if(band){
      // estimate sweep direction from horizontal shift of the band content
      const dir=estimateDir(img,pw,band);
      sonify(img,pw,ph,band,lmin,lmax);
      const arrow = dir>0.6?'▶ forward' : dir<-0.6?'◀ backward' : '• hold';
      statusEl.textContent = frozen ? 'band frozen'
                            : (graceFrames<CFG.GRACE ? 'holding… '+arrow : 'locked  '+arrow);
      statusEl.className='lock';
    }else{
      amps.fill(0);
      node.port.postMessage({type:'amps', amps});
      statusEl.textContent='seeking code…';
      statusEl.className='seek';
    }
    drawOverlay(band, pw, ph);
  }

  // fps
  frames++; fpsAcc+=now-last; last=now;
  if(fpsAcc>500){ fpsEl.textContent=Math.round(1000*frames/fpsAcc)+' fps'; frames=0; fpsAcc=0; }
  requestAnimationFrame(loop);
}

// estimate horizontal drift by correlating a mid-band luminance profile
// against the previous frame. positive = content moving left = camera moving
// right = forward playback.
function estimateDir(img,pw,band){
  const y=Math.round((band.top+band.bot)/2);
  const prof=new Float32Array(pw);
  for(let x=0;x<pw;x++){ const i=(y*pw+x)*4;
    prof[x]=img[i]*0.299+img[i+1]*0.587+img[i+2]*0.114; }
  let best=0,bestScore=Infinity;
  if(prevProfile && prevProfile.length===pw){
    for(let s=-6;s<=6;s++){                 // test small horizontal shifts
      let sc=0,n=0;
      for(let x=8;x<pw-8;x++){ const xs=x+s;
        if(xs<0||xs>=pw)continue; const d=prof[x]-prevProfile[xs]; sc+=d*d; n++; }
      sc/=Math.max(1,n);
      if(sc<bestScore){ bestScore=sc; best=s; }
    }
  }
  prevProfile=prof;
  dirSmooth = dirSmooth*0.7 + best*0.3;      // smooth jitter
  return dirSmooth;
}

function sonify(img,pw,ph,band,lmin,lmax){
  const cx=Math.floor(pw/2), half=(CFG.READ_COLS-1)/2;
  const bh=band.bot-band.top;
  const rng=Math.max(1,(lmax-lmin));       // stretch contrast to frame's range
  for(let b=0;b<CFG.N_BINS;b++){
    // bin -> vertical position in band (bin 0 = low freq = bottom)
    const f=b/(CFG.N_BINS-1);
    const y=Math.round(band.bot - f*bh);
    if(y<0||y>=ph){ amps[b]=0; continue; }
    let sum=0,cnt=0;
    for(let dx=-half;dx<=half;dx++){
      const x=cx+dx; if(x<0||x>=pw) continue;
      const i=(y*pw+x)*4;
      const lum=(img[i]*0.299+img[i+1]*0.587+img[i+2]*0.114);
      sum+=Math.min(1,Math.max(0,(lmax-lum)/rng)); cnt++;  // dark = loud, normalized
    }
    let a=cnt?sum/cnt:0;
    a=Math.pow(a,CFG.GAMMA);
    if(a<CFG.NOISE_GATE) a=0;
    amps[b]=a;
  }
  node.port.postMessage({type:'amps', amps});
}

// ---- overlay: band edges + playhead ----------------------------------
function drawOverlay(band,pw,ph){
  const W=overlay.width=overlay.clientWidth, H=overlay.height=overlay.clientHeight;
  octx.clearRect(0,0,W,H);
  const sx=W/pw, sy=H/ph;
  // playhead
  octx.strokeStyle='rgba(51,225,160,.9)'; octx.lineWidth=2;
  octx.beginPath(); octx.moveTo(W/2,0); octx.lineTo(W/2,H); octx.stroke();
  if(band){
    const t=band.top*sy, b=band.bot*sy;
    octx.strokeStyle='rgba(51,225,160,.55)'; octx.lineWidth=1.5;
    octx.setLineDash([6,6]);
    octx.beginPath(); octx.moveTo(0,t); octx.lineTo(W,t);
    octx.moveTo(0,b); octx.lineTo(W,b); octx.stroke();
    octx.setLineDash([]);
    octx.fillStyle='rgba(51,225,160,.08)';
    octx.fillRect(0,t,W,b-t);
  }
}

// ---- context self-check on load ---------------------------------------
(function(){
  const ok = window.isSecureContext && !!navigator.mediaDevices?.getUserMedia;
  const note=document.getElementById('ctxNote');
  note.textContent = ok
    ? 'secure context OK \u2022 '+location.protocol+'//'+location.host
    : '\u26a0 NOT a secure context ('+location.protocol+') \u2014 needs https';
  note.style.color = ok ? 'var(--accent)' : 'var(--warn)';
})();

// ---- controls ---------------------------------------------------------
startBtn.addEventListener('click', start);
gainEl.addEventListener('input', ()=>{ if(node) node.port.postMessage({type:'gain',value:gainEl.value/100}); });
freezeBtn.addEventListener('click', ()=>{
  frozen=!frozen;
  if(frozen){ /* frozenBand set from last good band */ }
  freezeBtn.textContent = frozen ? 'Unfreeze' : 'Freeze band';
  freezeBtn.classList.toggle('go', frozen);
});
// capture last good band for freeze
const _sonify=sonify;
sonify=function(img,pw,ph,band,lmin,lmax){ if(!frozen) frozenBand={top:band.top,bot:band.bot}; return _sonify(img,pw,ph,band,lmin,lmax); };
</script>
</body>
</html>
