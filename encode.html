<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PhonoPaper — Encode</title>
<style>
  :root{--bg:#0a0d10;--panel:#12181d;--line:#1e2731;--line2:#2a3742;--ink:#e8f0f4;
    --dim:#6b7d88;--accent:#33e1a0;--warn:#ff5d5d;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow-x:hidden}
  #wrap{max-width:560px;margin:0 auto;padding:28px 20px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  h1{margin:0;font-size:15px;letter-spacing:.22em;font-weight:500}
  h1 span{color:var(--accent)}
  .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  #stageWrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:24px 0}
  #rec{width:132px;height:132px;border-radius:50%;border:1px solid var(--line2);background:transparent;
    color:var(--ink);font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:.15s}
  #rec .dot{width:20px;height:20px;border-radius:50%;background:var(--accent)}
  #rec.armed{border-color:var(--accent);color:var(--accent)}
  #rec.recording{border-color:var(--warn);color:var(--warn)}
  #rec.recording .dot{background:var(--warn);border-radius:4px;animation:pulse 1s infinite}
  #rec:disabled{opacity:.5}
  @keyframes pulse{50%{opacity:.35}}
  #timer{font-size:34px;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--dim)}
  #timer b{color:var(--ink);font-weight:500}
  #meter{width:220px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  #meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .05s}
  #hint{font-size:11px;letter-spacing:.05em;color:var(--dim);text-align:center;max-width:34ch;line-height:1.7;min-height:1.6em}
  #hint.err{color:var(--warn)}
  #result{display:none;flex-direction:column;gap:16px;align-items:center;width:100%}
  #imgBox{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:#fff}
  #imgBox img{display:block;height:150px;width:auto;image-rendering:pixelated}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button.act{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;color:var(--ink);border:1px solid var(--line2);border-radius:3px;padding:12px 18px}
  button.act.go{border-color:var(--accent);color:var(--accent)}
  button.act:active{filter:brightness(1.3)}
  #saved{font-size:11px;letter-spacing:.06em;color:var(--accent);min-height:1.4em;text-align:center}
  footer{font-size:10px;letter-spacing:.08em;color:var(--dim);text-align:center;margin-top:18px}
  a.dl{display:none}
</style>
</head>
<body>
<div id="wrap">
  <header><h1>PHONO<span>PAPER</span></h1><div class="sub">Encode</div></header>
  <div id="stageWrap">
    <div id="capture" style="display:flex;flex-direction:column;align-items:center;gap:22px">
      <button id="rec" class="armed"><span class="dot"></span><span id="recLbl">Record</span></button>
      <div id="timer"><b>0.0</b> / 10.0s</div>
      <div id="meter"><i></i></div>
      <div id="hint">Tap to record up to 10 seconds. The code image saves automatically when done.</div>
    </div>
    <div id="result">
      <div id="imgBox"><img id="outImg" alt="phonopaper code"></div>
      <div id="saved"></div>
      <div class="btns">
        <button class="act go" id="again">Re-record</button>
        <button class="act" id="save">Save</button>
        <button class="act" id="share" style="display:none">Share</button>
      </div>
    </div>
  </div>
  <footer>384-bin A440 grid · C2–C10 · dark = loud</footer>
</div>
<a id="dl" class="dl"></a>

<script>
/* ===== PhonoPaper Encoder — exact 384-bin A440 grid ===== */
const FORMAT = {
  TOTAL_BINS:384, SEMI:12, MULTI:4, OCTAVES:8, A4_BIN:252, A4_FREQ:440,
  PX_PER_OCTAVE:90, DATA_H:720, MARGIN:88, THIN:9, GAP:10, THICK:39,
  SAMPLE_RATE:44100, FFT:4096, HOP:353, COLS_PER_SEC:125,
  MIN_DB:-60, MAX_DB:-10, MAX_SECONDS:10
};
const binFreq = b => FORMAT.A4_FREQ*Math.pow(2,(FORMAT.A4_BIN-b)/(FORMAT.SEMI*FORMAT.MULTI));

const $=id=>document.getElementById(id);
const recBtn=$('rec'),recLbl=$('recLbl'),timerEl=$('timer'),hint=$('hint'),
      capture=$('capture'),result=$('result'),outImg=$('outImg'),savedEl=$('saved'),dl=$('dl'),gainMeter=()=>document.querySelector('#meter i');

let ctx,stream,srcNode,procNode,recording=false;
let chunks=[],recordedLen=0,nativeRate=44100,stopTimer=null,rafTimer=null,t0=0;
function setHint(t,err){hint.textContent=t;hint.classList.toggle('err',!!err);}

recBtn.addEventListener('click',()=>{recording?stop():startRec();});

async function startRec(){
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){
    setHint('Needs HTTPS (or localhost). Serve the page, don\u2019t open the file directly.',true);return;}
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); }
  catch(e){ setHint('Microphone permission denied.',true); return; }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state!=='running') await ctx.resume();
  nativeRate=ctx.sampleRate;
  srcNode=ctx.createMediaStreamSource(stream);
  procNode=ctx.createScriptProcessor(4096,1,1);
  chunks=[];recordedLen=0;
  procNode.onaudioprocess=e=>{
    const inp=e.inputBuffer.getChannelData(0);
    chunks.push(new Float32Array(inp)); recordedLen+=inp.length;
    let s=0;for(let i=0;i<inp.length;i++)s+=inp[i]*inp[i];
    gainMeter().style.width=Math.min(100,Math.sqrt(s/inp.length)*260)+'%';
    e.outputBuffer.getChannelData(0).fill(0);
  };
  srcNode.connect(procNode); procNode.connect(ctx.destination);
  recording=true;t0=performance.now();
  recBtn.className='recording';recLbl.textContent='Stop';setHint('Recording… tap to stop early.');
  stopTimer=setTimeout(stop,FORMAT.MAX_SECONDS*1000); tick();
}
function tick(){ if(!recording)return;
  timerEl.innerHTML='<b>'+((performance.now()-t0)/1000).toFixed(1)+'</b> / '+FORMAT.MAX_SECONDS.toFixed(1)+'s';
  rafTimer=requestAnimationFrame(tick); }
function stop(){
  if(!recording)return; recording=false;
  clearTimeout(stopTimer);cancelAnimationFrame(rafTimer);
  try{srcNode.disconnect();procNode.disconnect();}catch(e){}
  stream.getTracks().forEach(t=>t.stop());
  recBtn.className='armed';recLbl.textContent='Record';gainMeter().style.width='0%';
  setHint('Processing…');
  const buf=new Float32Array(recordedLen);let o=0;
  for(const c of chunks){buf.set(c,o);o+=c.length;}
  setTimeout(()=>process(buf),30);
}

function resample(x,from,to){ if(from===to)return x;
  const n=Math.round(x.length*to/from),y=new Float32Array(n),r=from/to;
  for(let i=0;i<n;i++){const p=i*r,i0=p|0,f=p-i0;y[i]=(x[i0]||0)*(1-f)+(x[i0+1]||0)*f;} return y; }
function fft(re,im){const n=re.length;
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;
    if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;
      for(let k=0;k<len/2;k++){const ur=re[i+k],ui=im[i+k];
        const vr=re[i+k+len/2]*cr-im[i+k+len/2]*ci,vi=re[i+k+len/2]*ci+im[i+k+len/2]*cr;
        re[i+k]=ur+vr;im[i+k]=ui+vi;re[i+k+len/2]=ur-vr;im[i+k+len/2]=ui-vi;
        const ncr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=ncr;}}}}

function process(rawBuf){
  const F=FORMAT;
  if(recordedLen<F.SAMPLE_RATE*0.1){setHint('Too short — try again.',true);return;}
  const x=resample(rawBuf,nativeRate,F.SAMPLE_RATE);
  const N=F.FFT,HOP=F.HOP,half=N/2,binHz=F.SAMPLE_RATE/N;
  const hann=new Float32Array(N);for(let i=0;i<N;i++)hann[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  const nFrames=Math.max(1,Math.floor((x.length-N)/HOP)+1);

  // precompute FFT-bin interpolation for each of 384 grid bins
  const gk0=new Int32Array(F.TOTAL_BINS), gt=new Float32Array(F.TOTAL_BINS);
  for(let b=0;b<F.TOTAL_BINS;b++){ const kf=binFreq(b)/binHz; const k0=Math.min(half-1,Math.max(0,kf|0));
    gk0[b]=k0; gt[b]=Math.min(1,Math.max(0,kf-k0)); }

  const spec=new Float32Array(nFrames*F.TOTAL_BINS);
  const re=new Float32Array(N),im=new Float32Array(N);
  const dbSpan=F.MAX_DB-F.MIN_DB;
  for(let t=0;t<nFrames;t++){
    const off=t*HOP; im.fill(0);
    for(let i=0;i<N;i++) re[i]=(x[off+i]||0)*hann[i];
    fft(re,im);
    const fb=t*F.TOTAL_BINS;
    for(let b=0;b<F.TOTAL_BINS;b++){
      const k=gk0[b],tt=gt[b];
      const m0=Math.hypot(re[k],im[k]), m1=Math.hypot(re[k+1]||0,im[k+1]||0);
      const mag=m0*(1-tt)+m1*tt;
      const wam=mag/N;
      const db=20*Math.log10(Math.max(wam,1e-10));
      let A=(db-F.MIN_DB)/dbSpan; A=A<0?0:A>1?1:A;
      spec[fb+b]=A;
    }
  }

  // ---- render ----
  const W=nFrames, DATA=F.DATA_H;
  const band=new Uint8ClampedArray(W*DATA*4);
  for(let r=0;r<DATA;r++){
    const bin=Math.min(F.TOTAL_BINS-1, (r*F.TOTAL_BINS/DATA)|0);   // r=0 top = bin0 = high freq
    for(let c=0;c<W;c++){
      const A=spec[c*F.TOTAL_BINS+bin];
      const v=Math.round((1-A)*255);
      const idx=(r*W+c)*4; band[idx]=band[idx+1]=band[idx+2]=v; band[idx+3]=255;
    }
  }
  const markH=F.MARGIN+F.THIN+F.GAP+F.THIN+F.GAP+F.THICK+F.GAP+F.THIN; // 184
  const H=markH+DATA+markH;                                            // 1088
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  const tmp=document.createElement('canvas'); tmp.width=W; tmp.height=DATA;
  tmp.getContext('2d').putImageData(new ImageData(band,W,DATA),0,0);
  g.imageSmoothingEnabled=false; g.drawImage(tmp,0,markH);
  // marker stripes (black): top thin,thin,thick,thin ; bottom mirrored thin,thick,thin,thin
  g.fillStyle='#000';
  const stripes=[
    [F.MARGIN, F.THIN],
    [F.MARGIN+F.THIN+F.GAP, F.THIN],
    [F.MARGIN+F.THIN+F.GAP+F.THIN+F.GAP, F.THICK],
    [F.MARGIN+F.THIN+F.GAP+F.THIN+F.GAP+F.THICK+F.GAP, F.THIN]
  ];
  for(const [y,h] of stripes) g.fillRect(0,y,W,h);
  // bottom = mirror of top around image center
  for(const [y,h] of stripes) g.fillRect(0, H-y-h, W, h);

  cv.toBlob(blob=>{
    const url=URL.createObjectURL(blob), name='phonopaper-'+stamp()+'.png';
    outImg.src=url; dl.href=url; dl.download=name; dl.click();
    savedEl.textContent='Saved '+name+' ('+W+'×'+H+') to Downloads';
    $('save').onclick=()=>{dl.href=url;dl.download=name;dl.click();};
    if(navigator.canShare){const sb=$('share');sb.style.display='';
      sb.onclick=async()=>{try{const f=new File([blob],name,{type:'image/png'});
        if(navigator.canShare({files:[f]})) await navigator.share({files:[f]});}catch(e){}};}
    capture.style.display='none'; result.style.display='flex';
  },'image/png');
}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds());}

$('again').addEventListener('click',()=>{
  result.style.display='none';capture.style.display='flex';
  timerEl.innerHTML='<b>0.0</b> / 10.0s';savedEl.textContent='';
  setHint('Tap to record up to 10 seconds. The code image saves automatically when done.');
});
if(!window.isSecureContext) setHint('Needs HTTPS (or localhost) for the microphone.',true);
</script>
</body>
</html>
