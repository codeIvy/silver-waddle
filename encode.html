<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SpectroSweep — Encode</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12181d; --line:#1e2731; --line2:#2a3742;
    --ink:#e8f0f4; --dim:#6b7d88; --accent:#33e1a0; --warn:#ff5d5d;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font-family:var(--mono);overflow-x:hidden}
  #wrap{max-width:560px;margin:0 auto;padding:28px 20px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  h1{margin:0;font-size:15px;letter-spacing:.24em;font-weight:500}
  h1 span{color:var(--accent)}
  .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  #stageWrap{flex:1;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:22px;padding:24px 0}

  /* record button */
  #rec{width:132px;height:132px;border-radius:50%;border:1px solid var(--line2);
    background:transparent;color:var(--ink);font-family:var(--mono);font-size:12px;
    letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;transition:.15s}
  #rec .dot{width:20px;height:20px;border-radius:50%;background:var(--accent)}
  #rec.armed{border-color:var(--accent);color:var(--accent)}
  #rec.recording{border-color:var(--warn);color:var(--warn)}
  #rec.recording .dot{background:var(--warn);border-radius:4px;animation:pulse 1s infinite}
  #rec:disabled{opacity:.5}
  @keyframes pulse{50%{opacity:.35}}

  #timer{font-size:34px;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--dim)}
  #timer b{color:var(--ink);font-weight:500}
  /* level meter */
  #meter{width:220px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  #meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .05s}
  #hint{font-size:11px;letter-spacing:.05em;color:var(--dim);text-align:center;max-width:32ch;
    line-height:1.7;min-height:1.6em}
  #hint.err{color:var(--warn)}

  /* result */
  #result{display:none;flex-direction:column;gap:16px;align-items:center;width:100%}
  #imgBox{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:#fff}
  #imgBox img{display:block;height:150px;width:auto;image-rendering:pixelated}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button.act{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;color:var(--ink);border:1px solid var(--line2);border-radius:3px;
    padding:12px 18px}
  button.act.go{border-color:var(--accent);color:var(--accent)}
  button.act:active{filter:brightness(1.3)}
  #saved{font-size:11px;letter-spacing:.06em;color:var(--accent);min-height:1.4em;text-align:center}
  footer{font-size:10px;letter-spacing:.1em;color:var(--dim);text-align:center;margin-top:18px}
  a.dl{display:none}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>SPECTRO<span>SWEEP</span></h1>
    <div class="sub">Encode</div>
  </header>

  <div id="stageWrap">
    <!-- capture stage -->
    <div id="capture" style="display:flex;flex-direction:column;align-items:center;gap:22px">
      <button id="rec" class="armed"><span class="dot"></span><span id="recLbl">Record</span></button>
      <div id="timer"><b>0.0</b> / 10.0s</div>
      <div id="meter"><i></i></div>
      <div id="hint">Tap to record up to 10 seconds. The image saves automatically when done.</div>
    </div>

    <!-- result stage -->
    <div id="result">
      <div id="imgBox"><img id="outImg" alt="spectrogram"></div>
      <div id="saved"></div>
      <div class="btns">
        <button class="act go" id="again">Re-record</button>
        <button class="act" id="save">Save</button>
        <button class="act" id="share" style="display:none">Share</button>
      </div>
    </div>
  </div>

  <footer>80–5000 Hz · log · dark = loud</footer>
</div>
<a id="dl" class="dl"></a>

<script>
/* ================= SpectroSweep Encoder =================
   mic → STFT → log-frequency spectrogram between two rails → auto-saved PNG.
   Shared format contract (must match the decoder):                         */
const FORMAT = {
  F_LOW: 80, F_HIGH: 5000, LOG_SCALE: true,
  BAND_PX: 512, RAIL_PX: 24, GUARD_PX: 8, MARGIN_PX: 32,
  COLS_PER_SEC: 100, COL_PX: 2,
  DB_FLOOR: -55, GAMMA: 0.8, SAMPLE_RATE: 16000,
  MAX_SECONDS: 10
};

const $=id=>document.getElementById(id);
const recBtn=$('rec'), recLbl=$('recLbl'), timerEl=$('timer'), meterBar=$('#meter i')||document.querySelector('#meter i');
const hint=$('hint'), capture=$('capture'), result=$('result'), outImg=$('outImg'),
      savedEl=$('saved'), dl=$('dl');

let ctx, stream, srcNode, procNode, recording=false;
let chunks=[], recordedLen=0, nativeRate=44100, stopTimer=null, rafTimer=null, t0=0;

function setHint(t,err){ hint.textContent=t; hint.classList.toggle('err',!!err); }

// ---------- capture ----------
recBtn.addEventListener('click', ()=>{ recording ? stop() : startRec(); });

async function startRec(){
  if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
    setHint('Needs HTTPS (or localhost). Serve the page, don\u2019t open the file directly.',true); return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,
      noiseSuppression:false, autoGainControl:false}});
  }catch(e){ setHint('Microphone permission denied.',true); return; }

  ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state!=='running') await ctx.resume();
  nativeRate=ctx.sampleRate;
  srcNode=ctx.createMediaStreamSource(stream);
  procNode=ctx.createScriptProcessor(4096,1,1);
  chunks=[]; recordedLen=0;
  procNode.onaudioprocess=e=>{
    const inp=e.inputBuffer.getChannelData(0);
    chunks.push(new Float32Array(inp));
    recordedLen+=inp.length;
    // level meter (RMS)
    let s=0; for(let i=0;i<inp.length;i++) s+=inp[i]*inp[i];
    const rms=Math.sqrt(s/inp.length);
    document.querySelector('#meter i').style.width=Math.min(100,rms*260)+'%';
    // silence the output (no monitoring / feedback)
    const out=e.outputBuffer.getChannelData(0); out.fill(0);
  };
  srcNode.connect(procNode); procNode.connect(ctx.destination);

  recording=true; t0=performance.now();
  recBtn.className='recording'; recLbl.textContent='Stop';
  setHint('Recording… tap to stop early.');
  stopTimer=setTimeout(stop, FORMAT.MAX_SECONDS*1000);
  tick();
}

function tick(){
  if(!recording) return;
  const el=(performance.now()-t0)/1000;
  timerEl.innerHTML='<b>'+el.toFixed(1)+'</b> / '+FORMAT.MAX_SECONDS.toFixed(1)+'s';
  rafTimer=requestAnimationFrame(tick);
}

function stop(){
  if(!recording) return;
  recording=false;
  clearTimeout(stopTimer); cancelAnimationFrame(rafTimer);
  try{ srcNode.disconnect(); procNode.disconnect(); }catch(e){}
  stream.getTracks().forEach(t=>t.stop());
  recBtn.className='armed'; recLbl.textContent='Record';
  document.querySelector('#meter i').style.width='0%';
  setHint('Processing…');
  // merge chunks
  const buf=new Float32Array(recordedLen); let o=0;
  for(const c of chunks){ buf.set(c,o); o+=c.length; }
  setTimeout(()=>process(buf), 30);   // let UI paint "Processing…"
}

// ---------- DSP ----------
function resample(x, from, to){
  if(from===to) return x;
  const n=Math.round(x.length*to/from), y=new Float32Array(n), r=from/to;
  for(let i=0;i<n;i++){ const p=i*r, i0=p|0, f=p-i0;
    y[i]=(x[i0]||0)*(1-f)+(x[i0+1]||0)*f; }
  return y;
}
// in-place iterative radix-2 FFT (re,im)
function fft(re,im){
  const n=re.length; for(let i=1,j=0;i<n;i++){ let bit=n>>1;
    for(;j&bit;bit>>=1) j^=bit; j^=bit; if(i<j){ [re[i],re[j]]=[re[j],re[i]]; [im[i],im[j]]=[im[j],im[i]]; } }
  for(let len=2;len<=n;len<<=1){ const ang=-2*Math.PI/len, wr=Math.cos(ang), wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){ let cr=1, ci=0;
      for(let k=0;k<len/2;k++){ const ur=re[i+k], ui=im[i+k];
        const vr=re[i+k+len/2]*cr - im[i+k+len/2]*ci, vi=re[i+k+len/2]*ci + im[i+k+len/2]*cr;
        re[i+k]=ur+vr; im[i+k]=ui+vi; re[i+k+len/2]=ur-vr; im[i+k+len/2]=ui-vi;
        const ncr=cr*wr - ci*wi; ci=cr*wi + ci*wr; cr=ncr; } } }
}

function process(rawBuf){
  if(recordedLen < FORMAT.SAMPLE_RATE*0.1){ setHint('Too short — try again.',true); return; }
  const F=FORMAT;
  const x=resample(rawBuf, nativeRate, F.SAMPLE_RATE);
  const FRAME=1024, HOP=Math.round(F.SAMPLE_RATE/F.COLS_PER_SEC);
  const hann=new Float32Array(FRAME);
  for(let i=0;i<FRAME;i++) hann[i]=0.5-0.5*Math.cos(2*Math.PI*i/(FRAME-1));
  const nFrames=Math.max(1, Math.floor((x.length-FRAME)/HOP)+1);
  const half=FRAME/2;                       // 512 usable bins, binHz = SR/FRAME
  const binHz=F.SAMPLE_RATE/FRAME;

  // magnitude matrix, and global max for normalisation
  const mags=new Float32Array(nFrames*(half+1)); let maxMag=1e-9;
  const re=new Float32Array(FRAME), im=new Float32Array(FRAME);
  for(let t=0;t<nFrames;t++){
    const off=t*HOP; im.fill(0);
    for(let i=0;i<FRAME;i++) re[i]=(x[off+i]||0)*hann[i];
    fft(re,im);
    for(let k=0;k<=half;k++){ const m=Math.hypot(re[k],im[k]);
      mags[t*(half+1)+k]=m; if(m>maxMag) maxMag=m; }
  }

  // build the band image (ImageData), rows: 0=top=high freq
  const W=nFrames, H=F.BAND_PX;
  const band=new Uint8ClampedArray(W*H*4);
  const ratio=Math.log(F.F_HIGH/F.F_LOW);
  for(let r=0;r<H;r++){
    const p=1-r/(H-1);                        // 1 at top
    const freq=F.F_LOW*Math.exp(ratio*p);
    const fb=freq/binHz; const b0=fb|0, bf=fb-b0;
    for(let t=0;t<W;t++){
      const base=t*(half+1);
      const m0=mags[base+Math.min(half,b0)], m1=mags[base+Math.min(half,b0+1)];
      const m=m0*(1-bf)+m1*bf;
      const db=20*Math.log10(m/maxMag + 1e-12);
      let level=(db - F.DB_FLOOR)/(0 - F.DB_FLOOR);
      level=level<0?0:level>1?1:level;
      const dark=Math.pow(level, F.GAMMA);
      const v=Math.round(255*(1-dark));
      const idx=(r*W+t)*4; band[idx]=band[idx+1]=band[idx+2]=v; band[idx+3]=255;
    }
  }

  // compose final canvas with rails + margins, columns widened by COL_PX
  const contentW=W*F.COL_PX;
  const cw=F.MARGIN_PX*2+contentW;
  const ch=F.MARGIN_PX*2+F.RAIL_PX*2+F.GUARD_PX*2+F.BAND_PX;
  const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
  const g=cv.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,cw,ch);
  // draw band via a temp canvas scaled horizontally by COL_PX
  const tmp=document.createElement('canvas'); tmp.width=W; tmp.height=H;
  tmp.getContext('2d').putImageData(new ImageData(band,W,H),0,0);
  const bandTop=F.MARGIN_PX+F.RAIL_PX+F.GUARD_PX;
  g.imageSmoothingEnabled=false;
  g.drawImage(tmp, 0,0,W,H, F.MARGIN_PX, bandTop, contentW, H);
  // rails (full width, solid black)
  g.fillStyle='#000';
  g.fillRect(0, F.MARGIN_PX, cw, F.RAIL_PX);
  g.fillRect(0, ch-F.MARGIN_PX-F.RAIL_PX, cw, F.RAIL_PX);

  cv.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    outImg.src=url;
    const name='spectro-'+stamp()+'.png';
    // auto-download (inside the gesture chain from Record → Stop)
    dl.href=url; dl.download=name; dl.click();
    savedEl.textContent='Saved '+name+' to Downloads';
    // wire secondary buttons
    $('save').onclick=()=>{ dl.href=url; dl.download=name; dl.click(); };
    if(navigator.canShare){
      const shBtn=$('share'); shBtn.style.display='';
      shBtn.onclick=async()=>{ try{
        const file=new File([blob],name,{type:'image/png'});
        if(navigator.canShare({files:[file]})) await navigator.share({files:[file]});
      }catch(e){} };
    }
    capture.style.display='none'; result.style.display='flex';
  }, 'image/png');
}

function stamp(){ const d=new Date(), z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds()); }

$('again').addEventListener('click', ()=>{
  result.style.display='none'; capture.style.display='flex';
  timerEl.innerHTML='<b>0.0</b> / 10.0s'; savedEl.textContent='';
  setHint('Tap to record up to 10 seconds. The image saves automatically when done.');
});

// initial secure-context note
if(!window.isSecureContext) setHint('Needs HTTPS (or localhost) for the microphone.',true);
</script>
</body>
</html>
