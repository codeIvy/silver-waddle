<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#b7b8b3">
  <title>Palm OS — Applications</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone" aria-label="Palm OS handheld simulator">
    <div class="brand"><b>palm</b><span>m505</span></div>
    <section class="screen">
      <div class="app-view" id="app-view"></div>
      <footer class="softkeys">
        <button id="left-softkey" aria-label="Menu">☰</button>
        <span id="screen-title">Applications</span>
        <button id="right-softkey">Done</button>
      </footer>
    </section>
    <section class="graffiti" aria-hidden="true">
      <div class="quick"><span>⌂</span><span>☰</span></div>
      <div class="write-zone">
        <div class="letters"><b>abc</b><i></i></div>
        <div class="numbers"><b>123</b><i></i></div>
      </div>
      <div class="quick right"><span>⌕</span><span>⌨</span></div>
    </section>
    <section class="hardware" aria-hidden="true">
      <button><span>▣</span></button><button><span>☏</span></button>
      <div class="rocker"><i>▲</i><i>▼</i></div>
      <button><span>✓</span></button><button><span>✎</span></button>
    </section>
    <div class="footer-brand">Palm, Inc.</div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
