<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Paper Decoder</title>
<style>
body{margin:0;background:#111;color:#fff;font:14px system-ui}
video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
canvas{pointer-events:none}
#ui{position:fixed;z-index:3;left:12px;top:12px;background:#000b;padding:10px;border-radius:8px}
button{font:inherit;padding:10px}
</style>
<video id="video" playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="ui"><b>v0.1.0</b> <button id="start">Start</button> <span id="status"></span></div>
<script type="module">
import init, { WebSynth } from "./pkg/phonopaper_web.js";
import { findDataBand, sampleColumn } from "./common.js";

const video = document.querySelector("#video");
const overlay = document.querySelector("#overlay");
const status = document.querySelector("#status");
const work = document.createElement("canvas");
const ctx = work.getContext("2d", {willReadFrequently:true});
let synth, audio, nextTime = 0;

document.querySelector("#start").onclick = async () => {
  await init();
  synth = new WebSynth();
  audio = new AudioContext({sampleRate:44100});
  await audio.resume();

  video.srcObject = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:"environment"},width:{ideal:1280}},
    audio:false
  });
  await video.play();
  requestAnimationFrame(frame);
};

function queue(samples) {
  const buffer = audio.createBuffer(1, samples.length, 44100);
  buffer.copyToChannel(samples, 0);
  const source = audio.createBufferSource();
  source.buffer = buffer;
  source.connect(audio.destination);
  nextTime = Math.max(nextTime, audio.currentTime + 0.03);
  source.start(nextTime);
  nextTime += samples.length / 44100;
}

function frame() {
  const width = 640;
  const height = Math.round(width * video.videoHeight / video.videoWidth);
  work.width = width;
  work.height = height;
  ctx.drawImage(video, 0, 0, width, height);

  const data = ctx.getImageData(0,0,width,height);
  const band = findDataBand(data.data,width,height);

  if (band) {
    const column = sampleColumn(data.data,width,band.top,band.bottom,width >> 1);
    queue(synth.synthesize_column(column));
    status.textContent = "locked";
  } else {
    status.textContent = "find markers";
  }

  requestAnimationFrame(frame);
}
</script>
</html>
